services:
  db:
    image: postgres:16-alpine
    container_name: postgres_atendimento
    environment:
      POSTGRES_DB: meubanco
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meubanco"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: app_atendimento
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: meubanco
      DB_USER: postgres
      DB_PASS: "12345"
    stdin_open: true
    tty: true

volumes:
  pgdata:
